<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="CNECCS — 中美出口管制筛查与条件核对 / Bilingual China and U.S. export control screening.">
<meta name="referrer" content="no-referrer"><meta name="color-scheme" content="light">
<title>CNECCS · 出口管制筛查</title>
<!-- CNECCS_STARTUP_BEGIN -->
<style>
html:not(.cneccs-startup-complete) #app,html:not(.cneccs-startup-complete) .skip-link{visibility:hidden}
#startup-screen{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;align-items:safe center;overflow:auto;box-sizing:border-box;padding:28px 24px;background:#f5f8fa;color:#143449;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;transition:opacity .18s ease}
#startup-screen *,#startup-screen *::before,#startup-screen *::after{box-sizing:border-box}
#startup-screen[hidden]{display:none!important}#startup-screen.is-leaving{opacity:0;pointer-events:none}
.startup-card{width:min(100%,460px);padding:32px;background:#fff;border:1px solid #dce7ed;border-radius:14px;box-shadow:0 16px 48px rgba(17,56,78,.055)}
.startup-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px}
.startup-wordmark{font-size:24px;font-weight:750;letter-spacing:-.6px;color:#073c61;line-height:1.2}
.startup-language{display:inline-grid;grid-template-columns:42px 10px 42px;width:102px;min-width:102px;max-width:102px;align-items:center;border:1px solid #dce7ed;border-radius:7px;padding:3px;background:#fff}
.startup-language button{width:42px;min-width:42px;height:30px;border:0;border-radius:4px;padding:0;background:transparent;color:#667d8b;font:12px/1 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;cursor:pointer;white-space:nowrap}
.startup-language button[aria-pressed="true"]{background:#073c61;color:#fff}.startup-language span{font-size:12px;text-align:center;color:#667d8b}
#startup-screen button:focus-visible,#startup-screen a:focus-visible{outline:3px solid #1178ba;outline-offset:3px}
#startup-title{margin:0 0 10px;font-size:23px;line-height:1.4;font-weight:700;letter-spacing:-.4px}
#startup-description{min-height:44px;margin:0;color:#667d8b;font-size:13px;line-height:1.7}
.startup-progress-head{display:flex;justify-content:space-between;gap:12px;margin:24px 0 8px;font-size:12px;color:#667d8b}
#startup-progress-value{color:#073c61;font-variant-numeric:tabular-nums;font-weight:600}
.startup-progress-track{height:6px;overflow:hidden;border-radius:20px;background:#eaf1f5}
#startup-progress-fill{height:100%;width:100%;background:linear-gradient(90deg,#1178ba,#0e9bb8);transform:scaleX(0);transform-origin:left center;border-radius:inherit;animation:cneccs-startup-fill 17.5s linear forwards}
.startup-managed #startup-progress-fill{animation:none;transition:transform .12s linear}
.startup-modules{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0 0;padding:0;list-style:none}
.startup-module{display:flex;align-items:center;gap:8px;border:1px solid #e5edf2;border-radius:7px;padding:10px 11px;font-size:12px;min-width:0}
.startup-module-dot{width:7px;height:7px;border-radius:50%;background:#9fb4c0;flex-shrink:0}
.startup-module[data-state="loading"] .startup-module-dot{background:#1178ba;box-shadow:0 0 0 4px #eef6fa}
.startup-module[data-state="ready"] .startup-module-dot{background:#0e9b87}
.startup-module[data-state="error"] .startup-module-dot{background:#a97424}
.startup-module-copy{min-width:0;display:flex;flex-direction:column}.startup-module-copy strong{font-size:12px;font-weight:600;color:#143449}.startup-module-copy small{font-size:11px;line-height:1.5;color:#667d8b}
#startup-note{margin:18px 0 0;font-size:11px;line-height:1.6;color:#8b9da8}
#startup-retry{display:inline-flex;align-items:center;justify-content:center;margin-top:22px;min-height:42px;border:0;border-radius:7px;padding:10px 18px;background:#073c61;color:white;font:600 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;cursor:pointer}
#startup-retry[hidden],#startup-progress-group[hidden]{display:none!important}
#startup-static-help{margin:20px 0 0;color:#9d6816;font-size:12px;visibility:hidden;animation:cneccs-startup-help 0s 17.5s forwards}#startup-static-help a{color:#1178ba}
.startup-managed #startup-static-help{display:none}
.startup-noscript{color:#9d6816;font-size:12px;margin-top:16px}
@keyframes cneccs-startup-fill{to{transform:scaleX(1)}}@keyframes cneccs-startup-help{to{visibility:visible}}
@media(max-width:480px){#startup-screen{padding:20px}.startup-card{padding:25px 23px;border-radius:12px}.startup-top{margin-bottom:26px}.startup-wordmark{font-size:22px}#startup-title{font-size:21px}.startup-module{padding:9px}.startup-modules{gap:9px}}
@media(prefers-reduced-motion:reduce){#startup-screen,.startup-managed #startup-progress-fill{transition:none}}
</style>
<!-- CNECCS_STARTUP_END -->
<link rel="preload" as="style" href="styles.css?v=0.6.1">
</head>
<body>
<!-- CNECCS_STARTUP_BEGIN -->
<section id="startup-screen" aria-labelledby="startup-title" aria-busy="true">
  <div class="startup-card">
    <div class="startup-top"><strong class="startup-wordmark">CNECCS</strong><div class="startup-language" role="group" aria-label="语言选择"><button type="button" data-startup-lang="zh" aria-pressed="true">中文</button><span aria-hidden="true">|</span><button type="button" data-startup-lang="en" aria-pressed="false">EN</button></div></div>
    <h1 id="startup-title">正在准备查询工作台</h1>
    <p id="startup-description" role="status" aria-live="polite">启动过渡为 17.5 秒，中美检索资料正在同步准备。</p>
    <div id="startup-progress-group"><div class="startup-progress-head"><span id="startup-progress-label">启动进度</span><span id="startup-progress-value" aria-hidden="true">0%</span></div><div id="startup-progress" class="startup-progress-track" role="progressbar" aria-label="启动进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="startup-progress-fill"></div></div></div>
    <ul class="startup-modules" aria-label="资料状态"><li id="startup-cn" class="startup-module" data-state="idle"><span class="startup-module-dot" aria-hidden="true"></span><span class="startup-module-copy"><strong id="startup-cn-label">中国资料</strong><small id="startup-cn-status">准备中</small></span></li><li id="startup-us" class="startup-module" data-state="idle"><span class="startup-module-dot" aria-hidden="true"></span><span class="startup-module-copy"><strong id="startup-us-label">美国资料</strong><small id="startup-us-status">准备中</small></span></li></ul>
    <p id="startup-note">进度条表示启动过渡，不代表资料下载比例。</p>
    <button id="startup-retry" type="button" hidden>重新连接</button>
    <p id="startup-static-help">连接耗时较长，请<a href="">刷新页面</a>后重试。</p>
    <noscript><p class="startup-noscript">请启用浏览器的 JavaScript，然后刷新页面。</p></noscript>
  </div>
</section>
<!-- CNECCS_STARTUP_END -->
<a class="skip-link" href="#main">跳至主要内容</a>
<div id="app"><div class="loading-shell"><strong>CNECCS</strong><p>正在载入查询工作台…</p></div></div>
<div id="overlay-root"></div><div id="toast" role="status" aria-live="polite"></div>

</body></html>
